<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul Chauhan | Free Online Excel, CSV & PDF Studio</title>
  <meta name="description" content="A fast, private in-browser document viewer by Rahul Chauhan. View Excel, CSV, and PDF documents directly without installing software." />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --row-hover: #283548;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 24px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-title span {
      color: var(--primary);
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .container {
      max-width: 1000px;
      width: 90%;
      margin: 30px auto;
      flex: 1;
    }

    /* Tab Switcher */
    .tab-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      padding: 8px 18px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    #errorBanner {
      display: none;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    /* Upload Box */
    .upload-box {
      background: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .upload-box p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .actions-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      user-select: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--card-bg);
      border-color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    .file-status {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Table Container */
    .table-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    thead tr {
      background-color: #172033;
      border-bottom: 2px solid var(--border-color);
    }

    th {
      padding: 16px 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    /* PDF Section */
    #pdfSection {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .pdf-toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .pdf-canvas-wrapper {
      max-height: 70vh;
      overflow: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #0f172a;
      padding: 10px;
      display: flex;
      justify-content: center;
    }

    canvas {
      max-width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .privacy-notice {
      margin-top: 25px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">Rahul's <span>Doc & Data Studio</span></h1>
    <p class="subtitle">Secure in-browser viewer for Spreadsheets and PDF files</p>
  </header>

  <main class="container">
    <div class="tab-container">
      <button class="tab-btn active" id="excelTabBtn" type="button">📊 Excel / CSV Viewer</button>
      <button class="tab-btn" id="pdfTabBtn" type="button">📄 PDF Viewer</button>
    </div>

    <div id="errorBanner"></div>

    <div id="excelSection">
      <div class="upload-box" id="excelUploadBox">
        <label for="fileInputExcel" class="btn btn-primary">Choose Excel or CSV</label>
        <input type="file" id="fileInputExcel" accept=".xlsx, .xls, .csv" />
        <p>Supports .xlsx, .xls, and .csv files</p>
      </div>

      <div class="actions-bar" id="excelActionBar">
        <div class="button-group">
          <label for="fileInputExcel" class="btn btn-outline">Upload Different File</label>
          <button class="btn btn-primary" id="downloadBtn" type="button">Export Excel</button>
        </div>
        <span class="file-status" id="excelFileName"></span>
      </div>

      <div class="table-card" id="tableCard">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="pdfSection">
      <div class="pdf-toolbar">
        <label for="fileInputPdf" class="btn btn-primary">Choose PDF File</label>
        <input type="file" id="fileInputPdf" accept=".pdf" />

        <button class="btn btn-outline" id="prevPage" type="button">◀ Prev</button>
        <span>Page <span id="pageNum">0</span> / <span id="pageCount">0</span></span>
        <button class="btn btn-outline"
