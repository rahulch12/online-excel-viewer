<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul Chauhan | Doc & Data Studio</title>

  <!-- Reliable SheetJS CDN for Excel processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --row-hover: #273549;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
    }

    .brand-title span {
      color: var(--primary);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .container {
      max-width: 1050px;
      width: 90%;
      margin: 30px auto;
      flex: 1;
    }

    /* Tab Switcher */
    .tab-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Alert Banner */
    .alert-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      background-color: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    /* Upload Box */
    .dropzone {
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .dropzone p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      user-select: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--card-bg);
    }

    input[type="file"] {
      display: none;
    }

    .control-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Data Table */
    .table-wrapper {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
      max-height: 70vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      position: sticky;
      top: 0;
      background-color: #172033;
      z-index: 10;
    }

    th {
      padding: 14px 18px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    /* Native PDF Container */
    .pdf-viewer-box {
      display: none;
      width: 100%;
      height: 75vh;
      background: #334155;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .pdf-viewer-box embed, 
    .pdf-viewer-box object {
      width: 100%;
      height: 100%;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">Rahul's <span>Doc & Data Studio</span></h1>
    <p class="subtitle">Secure In-Browser Excel & PDF Workspace</p>
  </header>

  <main class="container">
    <!-- Navigation Tabs -->
    <div class="tab-nav">
      <button class="tab-btn active" id="btnTabExcel" type="button">📊 Excel & CSV Studio</button>
      <button class="tab-btn" id="btnTabPdf" type="button">📄 PDF Viewer</button>
    </div>

    <!-- Error Alert Message -->
    <div id="alertBox" class="alert-banner"></div>

    <!-- EXCEL PANE -->
    <section id="sectionExcel">
      <div class="dropzone" id="excelDropzone">
        <label for="inputExcel" class="btn btn-primary">Choose Excel or CSV</label>
        <input type="file" id="inputExcel" accept=".xlsx, .xls, .csv" />
        <p>Supports .xlsx, .xls, and .csv files (runs 100% locally)</p>
      </div>

      <div class="control-bar" id="excelControls">
        <div class="button-group">
          <label for="inputExcel" class="btn btn-outline">Change File</label>
          <button class="btn btn-primary" id="btnExportExcel" type="button">Export to Excel</button>
          <button class="btn btn-outline" id="btnExportPdf" type="button">Save as PDF</button>
        </div>
        <span id="excelFileInfo" style="font-size: 13px; color: var(--muted);"></span>
      </div>

      <div class="table-wrapper" id="tableWrapper">
        <table id="mainTable">
          <thead id="tblHead"></thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
    </section>

    <!-- PDF PANE -->
    <section id="sectionPdf" style="display: none;">
      <div class="dropzone" id="pdfDropzone">
        <label for="inputPdf" class="btn btn-primary">Choose PDF File</label>
        <input type="file" id="inputPdf" accept="application/pdf, .pdf" />
        <p>Uses your browser's native hardware-accelerated PDF viewer</p>
      </div>

      <div class="control-bar" id="pdfControls">
        <label for="inputPdf" class="btn btn-outline">Change PDF File</label>
        <span id="pdfFileInfo" style="font-size: 13px; color: var(--muted);"></span>
      </div>

      <div class="pdf-viewer-box" id="pdfViewerBox">
        <embed id="pdfEmbed" src="" type="application/pdf" />
      </div>
    </section>
  </main>

  <footer>
    Built by Rahul Chauhan • Client-Side Security
  </footer>

  <script>
    // Tab Elements
    const btnTabExcel = document.getElementById("btnTabExcel");
    const btnTabPdf = document.getElementById("btnTabPdf");
    const sectionExcel = document.getElementById("sectionExcel");
    const sectionPdf = document.getElementById("sectionPdf");
    const alertBox = document.getElementById("alertBox");

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = "block";
    }

    function clearAlert() {
      alertBox.textContent = "";
      alertBox.style.display = "none";
    }

    // Direct tab toggling
    btnTabExcel.onclick = function() {
      btnTabExcel.classList.add("active");
      btnTabPdf.classList.remove("active");
      sectionExcel.style.display = "block";
      sectionPdf.style.display = "none";
      clearAlert();
    };

    btnTabPdf.onclick = function() {
      btnTabPdf.classList.add("active");
      btnTabExcel.classList.remove("active");
      sectionPdf.style.display = "block";
      sectionExcel.style.display = "none";
      clearAlert();
    };

    // ================= EXCEL MODULE =================
    let parsedRows = [];
    const inputExcel = document.getElementById("inputExcel");
    const tblHead = document.getElementById("tblHead");
    const tblBody = document.getElementById("tblBody");
    const tableWrapper = document.getElementById("tableWrapper");
    const excelControls = document.getElementById("excelControls");
    const excelDropzone = document.getElementById("excelDropzone");
    const excelFileInfo = document.getElementById("excelFileInfo");
    const btnExportExcel = document.getElementById("btnExportExcel");
    const btnExportPdf = document.getElementById("btnExportPdf");

    inputExcel.onchange = function(e) {
      clearAlert();
      const file = e.target.files[0];
      if (!file) return;

      if (typeof XLSX === "undefined") {
        showAlert("XLSX parsing library was blocked by an extension or network rule. Please disable adblockers and refresh.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          
          if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
            throw new Error("No worksheets found in this workbook.");
          }

          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          parsedRows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

          if (!parsedRows || parsedRows.length === 0) {
            showAlert("The sheet has no readable data rows.");
            return;
          }

          // Render Headers
          tblHead.innerHTML = "";
          tblBody.innerHTML = "";
          const keys = Array.from(new Set(parsedRows.flatMap(row => Object.keys(row))));
          
          const trHead = document.createElement("tr");
          keys.forEach(k => {
            const th = document.createElement("th");
            th.textContent = k;
            trHead.appendChild(th);
          });
          tblHead.appendChild(trHead);

          // Render Rows
          parsedRows.forEach(row => {
            const tr = document.createElement("tr");
            keys.forEach(k => {
              const td = document.createElement("td");
              td.textContent = (row[k] !== undefined && row[k] !== null) ? row[k] : "";
              tr.appendChild(td);
            });
            tblBody.appendChild(tr);
          });

          // Show UI
          tableWrapper.style.display = "block";
          excelControls.style.display = "flex";
          excelDropzone.style.display = "none";
          excelFileInfo.textContent = `${file.name} (${parsedRows.length} rows)`;
        } catch (err) {
          showAlert("Error parsing Excel file: " + err.message);
        } finally {
          inputExcel.value = "";
        }
      };

      reader.readAsArrayBuffer(file);
    };

    // Export to Excel (.xlsx)
    btnExportExcel.onclick = function() {
      if (!parsedRows.length) return;
      const worksheet = XLSX.utils.json_to_sheet(parsedRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");
      XLSX.writeFile(workbook, "exported-data.xlsx");
    };

    // Export to PDF (Native, Clean, Responsive)
    btnExportPdf.onclick = function() {
      if (!parsedRows.length) return;

      const printWindow = window.open('', '_blank');
      const tableHtml = document.getElementById("tableWrapper").innerHTML;

      printWindow.document.write(`
        <html>
          <head>
            <title>Exported PDF Report</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; color: #111; }
              table { width: 100%; border-collapse: collapse; font-size: 12px; }
              th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; }
              th { background-color: #f3f4f6; font-weight: bold; }
              tr:nth-child(even) { background-color: #fafafa; }
              @media print {
                @page { size: landscape; margin: 10mm; }
              }
            </style>
          </head>
          <body>
            <h2 style="margin-bottom: 12px;">Spreadsheet Report</h2>
            ${tableHtml}
            <script>
              window.onload = function() { window.print(); }
            <\/script>
          </body>
        </html>
      `);
      printWindow.document.close();
    };

    // ================= PDF MODULE =================
    const inputPdf = document.getElementById("inputPdf");
    const pdfViewerBox = document.getElementById("pdfViewerBox");
    const pdfEmbed = document.getElementById("pdfEmbed");
    const pdfDropzone = document.getElementById("pdfDropzone");
    const pdfControls = document.getElementById("pdfControls");
    const pdfFileInfo = document.getElementById("pdfFileInfo");

    inputPdf.onchange = function(e) {
      clearAlert();
      const file = e.target.files[0];
      if (!file) return;

      try {
        const fileUrl = URL.createObjectURL(file);
        pdfEmbed.src = fileUrl;

        pdfViewerBox.style.display = "block";
        pdfControls.style.display = "flex";
        pdfDropzone.style.display = "none";
        pdfFileInfo.textContent = file.name;
      } catch (err) {
        showAlert("Failed to display PDF: " + err.message);
      } finally {
        inputPdf.value = "";
      }
    };
  </script>
</body>
</html>
