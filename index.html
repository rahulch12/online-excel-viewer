<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul Chauhan | Free Online Excel, CSV & PDF Studio</title>
  <meta name="description" content="A private, fast in-browser file studio by Rahul Chauhan. View Excel, CSV, and PDF documents directly without installing software." />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --row-hover: #283548;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 24px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-title span {
      color: var(--primary);
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .container {
      max-width: 1000px;
      width: 90%;
      margin: 30px auto;
      flex: 1;
    }

    /* Tab Switcher */
    .tab-container {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: #fff;
    }

    #errorBanner {
      display: none;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    /* Excel Section */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    thead tr {
      background-color: #172033;
      border-bottom: 2px solid var(--border-color);
    }

    th {
      padding: 16px 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    /* PDF Section */
    .pdf-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      padding: 20px;
      text-align: center;
    }

    .pdf-toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .pdf-canvas-wrapper {
      max-height: 70vh;
      overflow: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #334155;
      padding: 10px;
      display: flex;
      justify-content: center;
    }

    canvas {
      max-width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    /* Action Buttons */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 24px;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      user-select: none;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--card-bg);
      border-color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    .file-status {
      font-size: 13px;
      color: var(--text-muted);
    }

    .privacy-notice {
      margin-top: 25px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">Rahul's <span>Doc & Data Studio</span></h1>
    <p class="subtitle">Secure in-browser viewer for Spreadsheets and PDF files</p>
  </header>

  <main class="container">
    <div class="tab-container">
      <button class="tab-btn active" id="excelTabBtn">📊 Excel / CSV Viewer</button>
      <button class="tab-btn" id="pdfTabBtn">📄 PDF Viewer</button>
    </div>

    <div id="errorBanner"></div>

    <div id="excelSection">
      <div class="table-card">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="actions-bar">
        <div class="button-group">
          <label for="fileInputExcel" class="btn btn-primary">
            Upload Excel / CSV
          </label>
          <input type="file" id="fileInputExcel" accept=".xlsx, .xls, .csv" />

          <button class="btn btn-outline" id="downloadBtn">Export Excel</button>
        </div>
        <span class="file-status" id="excelFileName">Default demo loaded</span>
      </div>
    </div>

    <div id="pdfSection" class="pdf-card">
      <div class="pdf-toolbar">
        <label for="fileInputPdf" class="btn btn-primary">Upload PDF</label>
        <input type="file" id="fileInputPdf" accept=".pdf" />

        <button class="btn btn-outline" id="prevPage">◀ Prev</button>
        <span>Page <span id="pageNum">0</span> / <span id="pageCount">0</span></span>
        <button class="btn btn-outline" id="nextPage">Next ▶</button>
      </div>

      <div class="pdf-canvas-wrapper">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </div>

    <p class="privacy-notice">
      🔒 <strong>Client-Side Security:</strong> Parsing happens strictly on your device. Zero bytes leave your browser.
    </p>
  </main>

  <footer>
    <span>Built by Rahul Chauhan</span>
    <span>•</span>
    <a href="https://github.com/rahulch12/online-excel-viewer" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script>
    // Tab toggling logic
    const excelTabBtn = document.getElementById("excelTabBtn");
    const pdfTabBtn = document.getElementById("pdfTabBtn");
    const excelSection = document.getElementById("excelSection");
    const pdfSection = document.getElementById("pdfSection");
    const errorBanner = document.getElementById("errorBanner");

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    function clearError() {
      errorBanner.style.display = "none";
      errorBanner.textContent = "";
    }

    excelTabBtn.addEventListener("click", () => {
      excelTabBtn.classList.add("active");
      pdfTabBtn.classList.remove("active");
      excelSection.style.display = "block";
      pdfSection.style.display = "none";
      clearError();
    });

    pdfTabBtn.addEventListener("click", () => {
      pdfTabBtn.classList.add("active");
      excelTabBtn.classList.remove("active");
      pdfSection.style.display = "block";
      excelSection.style.display = "none";
      clearError();
    });

    // ================= EXCEL LOGIC =================
    let tableData = [
      { "ID": "TC-01", "Module": "Authentication", "Test Case": "Verify Login with Valid Credentials", "Status": "Passed" },
      { "ID": "TC-02", "Module": "Checkout", "Test Case": "Verify Discount Coupon Calculation", "Status": "Passed" },
      { "ID": "TC-03", "Module": "Reporting", "Test Case": "Validate Daily Sales Excel Export", "Status": "Passed" }
    ];

    const thead = document.getElementById("tableHead");
    const tbody = document.getElementById("tableBody");
    const fileInputExcel = document.getElementById("fileInputExcel");
    const excelFileName = document.getElementById("excelFileName");
    const downloadBtn = document.getElementById("downloadBtn");

    function renderTable(data) {
      thead.innerHTML = "";
      tbody.innerHTML = "";

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="100%" style="text-align:center; padding: 25px; color: var(--text-muted);">Sheet is empty</td></tr>';
        return;
      }

      const columns = Array.from(new Set(data.flatMap(row => Object.keys(row))));
      const trHead = document.createElement("tr");
      columns.forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);

      data.forEach(row => {
        const tr = document.createElement("tr");
        columns.forEach(col => {
          const td = document.createElement("td");
          td.textContent = (row[col] !== undefined && row[col] !== null) ? row[col] : "";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    fileInputExcel.addEventListener("change", (e) => {
      clearError();
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          tableData = XLSX.utils.sheet_to_json(sheet, { defval: "" });
          renderTable(tableData);
          excelFileName.textContent = `Loaded: ${file.name} (${tableData.length} rows)`;
        } catch (err) {
          showError(`Failed to load Excel: ${err.message}`);
        } finally {
          fileInputExcel.value = "";
        }
      };
      reader.readAsArrayBuffer(file);
    });

    downloadBtn.addEventListener("click", () => {
      const worksheet = XLSX.utils.json_to_sheet(tableData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");
      XLSX.writeFile(workbook, "exported-data.xlsx");
    });

    renderTable(tableData);

    // ================= PDF LOGIC =================
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pdfDoc = null;
    let pageNum = 1;
    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d");
    const fileInputPdf = document.getElementById("fileInputPdf");
    const pageNumDisplay = document.getElementById("pageNum");
    const pageCountDisplay = document.getElementById("pageCount");

    function renderPage(num) {
      if (!pdfDoc) return;
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.5 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        page.render(renderContext);
        pageNumDisplay.textContent = num;
      });
    }

    fileInputPdf.addEventListener("change", (e) => {
      clearError();
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function() {
        const typedArray = new Uint8Array(this.result);
        pdfjsLib.getDocument(typedArray).promise.then(pdf => {
          pdfDoc = pdf;
          pageNum = 1;
          pageCountDisplay.textContent = pdf.numPages;
          renderPage(pageNum);
        }).catch(err => {
          showError(`Failed to load PDF: ${err.message}`);
        });
      };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById("prevPage").addEventListener("click", () => {
      if (pdfDoc && pageNum > 1) {
        pageNum--;
        renderPage(pageNum);
      }
    });

    document.getElementById("nextPage").addEventListener("click", () => {
      if (pdfDoc && pageNum < pdfDoc.numPages) {
        pageNum++;
        renderPage(pageNum);
      }
    });
  </script>
</body>
</html>
