<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul Chauhan | Doc & Data Studio</title>

  <!-- SheetJS for Excel handling -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- jsPDF & AutoTable for Excel -> PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- PDF.js for reading PDF text -> Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --row-hover: #273549;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
    }

    .brand-title span {
      color: var(--primary);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .container {
      max-width: 1050px;
      width: 90%;
      margin: 30px auto;
      flex: 1;
    }

    /* Tabs */
    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Feedback Banner */
    .alert-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      background-color: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .dropzone {
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .dropzone p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
    }

    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      user-select: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--card-bg);
    }

    input[type="file"] {
      display: none;
    }

    .control-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Data Table */
    .table-wrapper {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
      max-height: 70vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      position: sticky;
      top: 0;
      background-color: #172033;
      z-index: 10;
    }

    th {
      padding: 14px 18px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    /* PDF Viewer Box */
    .pdf-viewer-box {
      display: none;
      width: 100%;
      height: 75vh;
      background: #334155;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .pdf-viewer-box object {
      width: 100%;
      height: 100%;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">Rahul's <span>Doc & Data Studio</span></h1>
    <p class="subtitle">Convert & View: Excel ⇄ PDF in your browser</p>
  </header>

  <main class="container">
    <!-- Tabs -->
    <div class="tab-nav">
      <button class="tab-btn active" id="btnTabExcel" type="button">📊 Excel Viewer & Convert</button>
      <button class="tab-btn" id="btnTabPdfViewer" type="button">📄 PDF Viewer</button>
      <button class="tab-btn" id="btnTabPdfToExcel" type="button">🔄 PDF to Excel</button>
    </div>

    <div id="alertBox" class="alert-banner"></div>

    <!-- TAB 1: EXCEL SECTION -->
    <section id="sectionExcel">
      <div class="dropzone" id="excelDropzone">
        <label for="inputExcel" class="btn btn-primary">Choose Excel or CSV</label>
        <input type="file" id="inputExcel" accept=".xlsx, .xls, .csv" />
        <p>Supports .xlsx, .xls, and .csv formats</p>
      </div>

      <div class="control-bar" id="excelControls">
        <div class="button-group">
          <label for="inputExcel" class="btn btn-outline">Change File</label>
          <button class="btn btn-primary" id="btnExportExcel" type="button">Export to Excel</button>
          <button class="btn btn-outline" id="btnExportPdf" type="button">Convert to PDF</button>
        </div>
        <span id="excelFileInfo" style="font-size: 13px; color: var(--muted);"></span>
      </div>

      <div class="table-wrapper" id="tableWrapper">
        <table>
          <thead id="tblHead"></thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
    </section>

    <!-- TAB 2: PDF VIEWER SECTION -->
    <section id="sectionPdfViewer" style="display: none;">
      <div class="dropzone" id="pdfDropzone">
        <label for="inputPdf" class="btn btn-primary">Choose PDF Document</label>
        <input type="file" id="inputPdf" accept="application/pdf, .pdf" />
        <p>Rendered natively inside your browser</p>
      </div>

      <div class="control-bar" id="pdfControls">
        <label for="inputPdf" class="btn btn-outline">Change PDF</label>
        <span id="pdfFileInfo" style="font-size: 13px; color: var(--muted);"></span>
      </div>

      <div class="pdf-viewer-box" id="pdfViewerBox">
        <object id="pdfObject" data="" type="application/pdf">
          <p style="padding: 20px; text-align: center; color: #fff;">
            Preview not available. <a id="pdfFallbackLink" href="#" target="_blank" style="color: var(--primary);">Open file directly</a>.
          </p>
        </object>
      </div>
    </section>

    <!-- TAB 3: PDF TO EXCEL CONVERTER -->
    <section id="sectionPdfToExcel" style="display: none;">
      <div class="dropzone" id="pdfToExcelDropzone">
        <label for="inputPdfConvert" class="btn btn-primary">Upload PDF to Extract to Excel</label>
        <input type="file" id="inputPdfConvert" accept="application/pdf, .pdf" />
        <p>Extracts text and table structures from text-based PDFs into spreadsheet rows</p>
      </div>

      <div class="control-bar" id="pdfConvertControls">
        <div class="button-group">
          <label for="inputPdfConvert" class="btn btn-outline">Upload Different PDF</label>
          <button class="btn btn-primary" id="btnDownloadExtractedExcel" type="button">Download Extracted Excel</button>
        </div>
        <span id="pdfConvertInfo" style="font-size: 13px; color: var(--muted);"></span>
      </div>

      <div class="table-wrapper" id="pdfConvertTableWrapper">
        <table>
          <thead id="pdfConvertHead"></thead>
          <tbody id="pdfConvertBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    Built by Rahul Chauhan • 100% Client-Side Processing
  </footer>

  <script>
    // Tab switching
    const btnTabExcel = document.getElementById("btnTabExcel");
    const btnTabPdfViewer = document.getElementById("btnTabPdfViewer");
    const btnTabPdfToExcel = document.getElementById("btnTabPdfToExcel");
    
    const sectionExcel = document.getElementById("sectionExcel");
    const sectionPdfViewer = document.getElementById("sectionPdfViewer");
    const sectionPdfToExcel = document.getElementById("sectionPdfToExcel");
    const alertBox = document.getElementById("alertBox");

    function showAlert(message) {
      alertBox.textContent = message;
      alertBox.style.display = "block";
    }

    function clearAlert() {
      alertBox.textContent = "";
      alertBox.style.display = "none";
    }

    function switchTab(activeBtn, activeSection) {
      [btnTabExcel, btnTabPdfViewer, btnTabPdfToExcel].forEach(btn => btn.classList.remove("active"));
      [sectionExcel, sectionPdfViewer, sectionPdfToExcel].forEach(sec => sec.style.display = "none");

      activeBtn.classList.add("active");
      activeSection.style.display = "block";
      clearAlert();
    }

    btnTabExcel.addEventListener("click", () => switchTab(btnTabExcel, sectionExcel));
    btnTabPdfViewer.addEventListener("click", () => switchTab(btnTabPdfViewer, sectionPdfViewer));
    btnTabPdfToExcel.addEventListener("click", () => switchTab(btnTabPdfToExcel, sectionPdfToExcel));

    // ================= 1. EXCEL VIEWER & EXPORT =================
    let parsedRows = [];
    const inputExcel = document.getElementById("inputExcel");
    const tblHead = document.getElementById("tblHead");
    const tblBody = document.getElementById("tblBody");
    const tableWrapper = document.getElementById("tableWrapper");
    const excelControls = document.getElementById("excelControls");
    const excelDropzone = document.getElementById("excelDropzone");
    const excelFileInfo = document.getElementById("excelFileInfo");
    const btnExportExcel = document.getElementById("btnExportExcel");
    const btnExportPdf = document.getElementById("btnExportPdf");

    inputExcel.addEventListener("change", function(evt) {
      clearAlert();
      const file = evt.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const buffer = e.target.result;
          const workbook = XLSX.read(buffer, { type: "binary" });
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];
          parsedRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

          if (!parsedRows || parsedRows.length === 0) {
            showAlert("The sheet contains no readable rows.");
            return;
          }

          tblHead.innerHTML = "";
          tblBody.innerHTML = "";
          const keys = Array.from(new Set(parsedRows.flatMap(row => Object.keys(row))));
          
          const trHead = document.createElement("tr");
          keys.forEach(k => {
            const th = document.createElement("th");
            th.textContent = k;
            trHead.appendChild(th);
          });
          tblHead.appendChild(trHead);

          parsedRows.forEach(row => {
            const tr = document.createElement("tr");
            keys.forEach(k => {
              const td = document.createElement("td");
              td.textContent = (row[k] !== undefined && row[k] !== null) ? row[k] : "";
              tr.appendChild(td);
            });
            tblBody.appendChild(tr);
          });

          tableWrapper.style.display = "block";
          excelControls.style.display = "flex";
          excelDropzone.style.display = "none";
          excelFileInfo.textContent = `${file.name} (${parsedRows.length} rows)`;
        } catch (err) {
          showAlert("Failed to parse file: " + err.message);
        } finally {
          inputExcel.value = "";
        }
      };
      reader.readAsBinaryString(file);
    });

    // Export to Excel
    btnExportExcel.addEventListener("click", function() {
      if (!parsedRows.length) return;
      const worksheet = XLSX.utils.json_to_sheet(parsedRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");
      XLSX.writeFile(workbook, "converted-data.xlsx");
    });

    // Convert Excel -> PDF
    btnExportPdf.addEventListener("click", function() {
      if (!parsedRows.length) return;

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "landscape" });

        const keys = Array.from(new Set(parsedRows.flatMap(row => Object.keys(row))));
        const bodyData = parsedRows.map(row => keys.map(k => String(row[k] || "")));

        doc.text("Converted Sheet Document", 14, 15);
        doc.autoTable({
          head: [keys],
          body: bodyData,
          startY: 20,
          styles: { fontSize: 8 },
          theme: 'striped'
        });

        doc.save("sheet-converted.pdf");
      } catch (err) {
        showAlert("Failed to export PDF: " + err.message);
      }
    });

    // ================= 2. PDF VIEWER =================
    const inputPdf = document.getElementById("inputPdf");
    const pdfViewerBox = document.getElementById("pdfViewerBox");
    const pdfObject = document.getElementById("pdfObject");
    const pdfFallbackLink = document.getElementById("pdfFallbackLink");
    const pdfDropzone = document.getElementById("pdfDropzone");
    const pdfControls = document.getElementById("pdfControls");
    const pdfFileInfo = document.getElementById("pdfFileInfo");

    inputPdf.addEventListener("change", function(evt) {
      clearAlert();
      const file = evt.target.files[0];
      if (!file) return;

      try {
        const fileUrl = URL.createObjectURL(file);
        pdfObject.data = fileUrl;
        pdfFallbackLink.href = fileUrl;

        pdfViewerBox.style.display = "block";
        pdfControls.style.display = "flex";
        pdfDropzone.style.display = "none";
        pdfFileInfo.textContent = file.name;
      } catch (err) {
        showAlert("Failed to display PDF: " + err.message);
      } finally {
        inputPdf.value = "";
      }
    });

    // ================= 3. PDF TO EXCEL CONVERTER =================
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    }

    let extractedRows = [];
    const inputPdfConvert = document.getElementById("inputPdfConvert");
    const pdfToExcelDropzone = document.getElementById("pdfToExcelDropzone");
    const pdfConvertControls = document.getElementById("pdfConvertControls");
    const pdfConvertInfo = document.getElementById("pdfConvertInfo");
    const pdfConvertTableWrapper = document.getElementById("pdfConvertTableWrapper");
    const pdfConvertHead = document.getElementById("pdfConvertHead");
    const pdfConvertBody = document.getElementById("pdfConvertBody");
    const btnDownloadExtractedExcel = document.getElementById("btnDownloadExtractedExcel");

    inputPdfConvert.addEventListener("change", function(evt) {
      clearAlert();
      const file = evt.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function() {
        try {
          const typedArray = new Uint8Array(this.result);
          const pdf = await pdfjsLib.getDocument(typedArray).promise;
          
          extractedRows = [];

          // Parse each page
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            
            // Group text items by approximate Y coordinate (line by line)
            const lines = {};
            textContent.items.forEach(item => {
              const y = Math.round(item.transform[5]);
              if (!lines[y]) lines[y] = [];
              lines[y].push(item.str.trim());
            });

            // Sort lines from top to bottom
            const sortedY = Object.keys(lines).sort((a, b) => Number(b) - Number(a));

            sortedY.forEach(y => {
              const tokens = lines[y].filter(t => t.length > 0);
              if (tokens.length > 0) {
                extractedRows.push(tokens);
              }
            });
          }

          if (extractedRows.length === 0) {
            showAlert("No extractable text found in this PDF (it might be a scanned image).");
            return;
          }

          // Render into preview table
          pdfConvertHead.innerHTML = "";
          pdfConvertBody.innerHTML = "";

          const maxCols = Math.max(...extractedRows.map(r => r.length));
          const trHead = document.createElement("tr");
          for (let c = 1; c <= maxCols; c++) {
            const th = document.createElement("th");
            th.textContent = `Column ${c}`;
            trHead.appendChild(th);
          }
          pdfConvertHead.appendChild(trHead);

          extractedRows.forEach(r => {
            const tr = document.createElement("tr");
            for (let c = 0; c < maxCols; c++) {
              const td = document.createElement("td");
              td.textContent = r[c] !== undefined ? r[c] : "";
              tr.appendChild(td);
            }
            pdfConvertBody.appendChild(tr);
          });

          pdfConvertTableWrapper.style.display = "block";
          pdfConvertControls.style.display = "flex";
          pdfToExcelDropzone.style.display = "none";
          pdfConvertInfo.textContent = `${file.name} (${extractedRows.length} lines parsed)`;
        } catch (err) {
          showAlert("Failed to convert PDF: " + err.message);
        } finally {
          inputPdfConvert.value = "";
        }
      };

      reader.readAsArrayBuffer(file);
    });

    btnDownloadExtractedExcel.addEventListener("click", function() {
      if (!extractedRows.length) return;
      const worksheet = XLSX.utils.aoa_to_sheet(extractedRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Extracted");
      XLSX.writeFile(workbook, "extracted-from-pdf.xlsx");
    });
  </script>
</body>
</html>
