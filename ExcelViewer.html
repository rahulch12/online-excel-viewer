<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataGrid Pro | Excel Viewer</title>
  <!-- More reliable CDN via Cloudflare / cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --row-hover: #283548;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 24px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-title span {
      color: var(--primary);
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .container {
      max-width: 1000px;
      width: 90%;
      margin: 40px auto;
      flex: 1;
    }

    #errorBanner {
      display: none;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    thead tr {
      background-color: #172033;
      border-bottom: 2px solid var(--border-color);
    }

    th {
      padding: 16px 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 24px;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      user-select: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--card-bg);
      border-color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    .file-status {
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title">DataGrid<span>.io</span></h1>
    <p class="subtitle">Fast in-browser spreadsheet preview & editor</p>
  </header>

  <main class="container">
    <div id="errorBanner"></div>

    <div class="table-card">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="actions-bar">
      <div class="button-group">
        <label for="fileInput" class="btn btn-primary">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
            <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
          </svg>
          Upload Excel
        </label>
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />

        <button class="btn btn-outline" id="downloadBtn">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
          </svg>
          Export
        </button>
      </div>

      <span class="file-status" id="fileName">No file loaded (showing sample data)</span>
    </div>
  </main>

  <script>
    let tableData = [
      { "ID": "#101", "Item": "Wireless Mouse", "Category": "Hardware", "Stock": 142, "Price ($)": 29.99 },
      { "ID": "#102", "Item": "Mechanical Keyboard", "Category": "Hardware", "Stock": 64, "Price ($)": 89.00 },
      { "ID": "#103", "Item": "Cloud Subscription", "Category": "Services", "Stock": 980, "Price ($)": 12.50 }
    ];

    const thead = document.getElementById("tableHead");
    const tbody = document.getElementById("tableBody");
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const downloadBtn = document.getElementById("downloadBtn");
    const errorBanner = document.getElementById("errorBanner");

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    function clearError() {
      errorBanner.style.display = "none";
      errorBanner.textContent = "";
    }

    function renderTable(data) {
      thead.innerHTML = "";
      tbody.innerHTML = "";

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="100%" style="text-align:center; padding: 30px; color: var(--text-muted);">The uploaded sheet is empty</td></tr>';
        return;
      }

      // Collect unique keys across all rows in case some records have missing keys
      const columns = Array.from(new Set(data.flatMap(row => Object.keys(row))));

      const trHead = document.createElement("tr");
      columns.forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);

      data.forEach(row => {
        const tr = document.createElement("tr");
        columns.forEach(col => {
          const td = document.createElement("td");
          td.textContent = (row[col] !== undefined && row[col] !== null) ? row[col] : "";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    fileInput.addEventListener("change", (e) => {
      clearError();
      const file = e.target.files[0];
      if (!file) return;

      // Verify library availability
      if (typeof XLSX === "undefined") {
        showError("Excel parser library (XLSX) failed to load. Check your internet connection or ad-blocker.");
        return;
      }

      fileName.textContent = `Loading ${file.name}...`;

      const reader = new FileReader();
      
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          
          if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
            throw new Error("No worksheets found in this workbook.");
          }

          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          
          // defval: "" ensures cells with blank values don't break columns
          tableData = XLSX.utils.sheet_to_json(sheet, { defval: "" });
          
          renderTable(tableData);
          fileName.textContent = `Loaded: ${file.name} (${tableData.length} rows)`;
        } catch (err) {
          console.error(err);
          showError(`Failed to parse file: ${err.message}`);
          fileName.textContent = "Error loading file";
        } finally {
          // Reset file input value so re-uploading the exact same file fires 'change' again
          fileInput.value = "";
        }
      };

      reader.onerror = () => {
        showError("FileReader failed to read the file from disk.");
        fileName.textContent = "Error reading file";
      };

      reader.readAsArrayBuffer(file);
    });

    downloadBtn.addEventListener("click", () => {
      if (typeof XLSX === "undefined") {
        showError("Excel library not loaded.");
        return;
      }
      const worksheet = XLSX.utils.json_to_sheet(tableData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");
      XLSX.writeFile(workbook, "exported-data.xlsx");
    });

    renderTable(tableData);
  </script>
</body>
</html>
