<div class="mt-6 pt-4 border-t border-gray-800 space-y-3">
  <div class="flex justify-between items-center">
    <h3 class="font-medium text-sm">Expense Ledger (${state.expenses.length})</h3>
    <div class="space-x-2">
      <button onclick="exportToExcel('expenses')" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-1.5 rounded font-medium">Excel</button>
      <button onclick="window.print()" class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1.5 rounded font-medium">Print</button>
    </div>
  </div>

  <!-- WRAP THIS SCROLL CONTAINER AROUND THE TABLE -->
  <div class="max-h-60 overflow-y-auto border border-gray-800 rounded-lg">
    <table class="w-full text-left text-xs">
      <thead class="bg-[#0b0f19] text-gray-400 sticky top-0">
        <tr>
          <th class="p-2">Description</th>
          <th class="p-2">Category</th>
          <th class="p-2">Amount</th>
          <th class="p-2">Vendor</th>
          <th class="p-2">Mode</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-800">
        ${state.expenses.length === 0 ? `
          <tr><td colspan="5" class="p-4 text-center text-gray-500">No expenses recorded yet.</td></tr>
        ` : state.expenses.map(item => `
          <tr class="hover:bg-[#0b0f19]/50">
            <td class="p-2 font-medium">${item.description}</td>
            <td class="p-2 text-gray-400">${item.category}</td>
            <td class="p-2 text-rose-400 font-semibold">₹${item.amount}</td>
            <td class="p-2 text-gray-400">${item.vendor || '-'}</td>
            <td class="p-2 text-gray-400">${item.mode}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
</div>
